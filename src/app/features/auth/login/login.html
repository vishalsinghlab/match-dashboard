<div class="login-wrapper">
  <div class="login-container">
    <div class="login-header">
      <!-- <div class="brand-badge">
        <span class="dot-live-pulse"></span>
        <span class="badge-text">CONTROL CENTER</span>
      </div> -->
      <h1 class="login-title">Sign in to Match Engine</h1>
      <p class="login-subtitle">Access live sports feeds, track match scores, and follow real-time updates.</p>
    </div>

    <div class="login-card">
      <form (ngSubmit)="login()" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user input-icon"></i>
            <input id="username" name="username" type="text" [(ngModel)]="username" placeholder="e.g. user or admin"
              autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock input-icon"></i>
            <input id="password" name="password" type="password" [(ngModel)]="password" placeholder="••••••••"
              autocomplete="current-password" />
          </div>
        </div>

        @if (errorMessage()) {
        <div class="error-callout">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span>{{ errorMessage() }}</span>
        </div>
        }

        <button type="submit" class="btn-login-submit" [disabled]="isLoading()">
          @if (isLoading()) {
          <span class="spinner-sm"></span>
          <span>Authenticating...</span>
          } @else {
          <span>Continue to Dashboard</span>
          <i class="fa-solid fa-arrow-right"></i>
          }
        </button>
      </form>

      <div class="demo-section">
        <div class="demo-header">
          <span class="demo-label">Quick Demo Access</span>
        </div>
        <div class="demo-actions">
          <button type="button" class="demo-chip" (click)="fillDemo('user')">
            <i class="fa-solid fa-user-gear"></i>
            <span>Standard User</span>
          </button>
          <button type="button" class="demo-chip admin-chip" (click)="fillDemo('admin')">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Administrator</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
