@if (!isLoginPage()) {
<header class="app-header">
  <div class="header-container">
    <div class="brand-group">
      <a routerLink="/matches" class="brand-logo">
        <!-- <div class="logo-mark">
          <span class="dot-live-pulse"></span>
        </div> -->
        <span class="brand-name">MATCH ENGINE</span>
        <span class="brand-version">v1.0</span>
      </a>

      <nav class="main-nav">
        <a routerLink="/matches" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}"
          class="nav-link">
          <i class="fa-solid fa-trophy"></i>
          <span>Live Hub</span>
        </a>
        @if (isAdmin()) {
        <a routerLink="/admin/matches" routerLinkActive="active-link" class="nav-link">
          <i class="fa-solid fa-sliders"></i>
          <span>Admin Console</span>
        </a>
        }
      </nav>
    </div>

    <div class="header-right">
      <button type="button" class="btn-theme-toggle" (click)="cycleTheme()" [title]="'Current theme: ' + themeService.currentTheme() + '. Click to cycle.'">
        @if (themeService.currentTheme() === 'dark') {
          <i class="fa-solid fa-moon"></i>
          <span>Dark</span>
        } @else if (themeService.currentTheme() === 'light') {
          <i class="fa-solid fa-sun"></i>
          <span>Light</span>
        } @else {
          <i class="fa-solid fa-wand-magic-sparkles"></i>
          <span>Cyber</span>
        }
      </button>

      <div class="nav-divider"></div>

      <button type="button" class="btn-logout" (click)="logout()" title="Sign out of workspace">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
        <span>Sign Out</span>
      </button>
    </div>
  </div>
</header>
}

<main class="app-main-content">
  <router-outlet />
</main>
